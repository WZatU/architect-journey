[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architect-journey-ai"
version = "0.1.0"
description = "Project-based AI engineering curriculum and reproducible baselines"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "scikit-learn==1.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_path*"]
